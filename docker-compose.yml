version: '3.8'

services:
  quote:
    build:
      context: ./quote_service
      dockerfile: Dockerfile
    container_name: shifeng-quote
    ports:
      - "3001:3001"
    restart: unless-stopped

  etf-monitor:
    build:
      context: .
      dockerfile: server/etf_monitor/Dockerfile
    container_name: shifeng-etf-monitor
    environment:
      DB_PATH: /data/etf_monitor.db
      TRADING_CALENDAR_PATH: /data/trading_calendar.json
      APP_TIMEZONE: Asia/Shanghai
    volumes:
      - etf-monitor-data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: shifeng-api
    ports:
      - "3000:3000"
    environment:
      ETF_MONITOR_ENABLED: "0"
      ETF_MONITOR_URL: http://etf-monitor:8000
    depends_on:
      quote:
        condition: service_started
      etf-monitor:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: shifeng-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  etf-monitor-data:
