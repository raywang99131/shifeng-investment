name = "shifeng-investment"
compatibility_date = "2024-09-23"

# Cloudflare Workers Builds runs `wrangler versions upload`. Publish the Vite
# output as a static single-page application; runtime data remains on the local
# Express service and is intentionally not bundled into this public Worker.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Local development settings.
[dev]
port = 8788
ip = "0.0.0.0"
